<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Homesick Creative project gallery."
  >

  <title>Gallery — Homesick Creative</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
    rel="stylesheet"
  >

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="./assets/styles.css">
</head>

<body>
	<!-- Navigation -->
	<header class="site-header">

	  <!-- Homesick Creative logo -->
	  <a
	    class="logo-link"
	    href="./index.html"
	    aria-label="Homesick Creative home"
	  >
	    <img
	      class="site-logo"
	      src="./assets/logo-homesick-black-HD.png"
	      alt="Homesick Creative"
	    >
	  </a>

	  <!-- Right side of the navigation -->
	  <div class="gallery-header-actions">

	    <!-- Dark-mode button -->
	    <button
	      class="theme-toggle"
	      type="button"
	      aria-label="Switch to dark mode"
	    >
	      <span class="theme-icon" aria-hidden="true">☾</span>
	    </button>

	    <!-- Back to homepage -->
	    <a
	      class="gallery-back-link"
	      href="./index.html#work"
	    >
	      ← Back to work
	    </a>

	  </div>

	</header>
  <!-- Gallery content -->
  <main class="gallery-page">

    <header class="gallery-page-header">

      <div>
        <p class="eyebrow">Selected work</p>

        <!-- Filled automatically by gallery.js -->
        <h1 id="gallery-title">Gallery</h1>
      </div>

      <!-- Filled automatically by gallery.js -->
      <p id="gallery-description"></p>

    </header>

    <!-- JavaScript adds the photos and videos here -->
    <section
      class="media-grid"
      id="media-grid"
      aria-live="polite"
    ></section>

    <!-- Displayed if the category does not exist -->
    <section class="gallery-error" id="gallery-error" hidden>

      <h2>Gallery not found</h2>

      <p>
        This gallery does not exist or has not been added yet.
      </p>

      <a href="./index.html#work">
        Return to selected work
      </a>

    </section>

  </main>

  <!-- Footer -->
  <footer>

	<a class="logo-link" href="./index.html" aria-label="Homesick Creative home">
	  <img
	    class="site-logo"
	    src="./assets/logo-homesick-black-HD.png"
	    alt="Homesick Creative"
	  >
	</a>
    <p>
      Creative work, wherever the story takes us.
    </p>

    <p>
      © 2026 Homesick Creative
    </p>

  </footer>

  <!-- Gallery JavaScript -->
  <script src="./assets/gallery.js"></script>

</body>

</html>
